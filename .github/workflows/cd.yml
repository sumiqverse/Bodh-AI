name: CD (Continuous Delivery)

on:
  push:
    branches:
      - main
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+*'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-and-verify:
    name: Build & Pre-deployment Verification
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          version: 'latest'

      - name: Setup Python 3.12
        run: uv python install 3.12

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: 'pnpm'

      - name: Install dependencies
        run: |
          pnpm install --frozen-lockfile
          cd apps/api && uv sync --all-groups

      - name: Verify build & tests
        run: pnpm verify
        env:
          CI: true

  deploy-staging:
    name: Deploy to Staging (Auto on Merge)
    needs: [build-and-verify]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    environment:
      name: staging
      url: https://staging.bodhai.internal
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Web Container (Staging)
        run: |
          docker build \
            --file apps/web/Dockerfile \
            --tag bodhai-web:staging-${{ github.sha }} \
            --build-arg NEXT_PUBLIC_APP_ENV=staging \
            --build-arg NEXT_PUBLIC_API_URL=https://api-staging.bodhai.internal .

      - name: Build API Container (Staging)
        run: |
          docker build \
            --file apps/api/Dockerfile \
            --tag bodhai-api:staging-${{ github.sha }} .

      - name: Run Staging Migrations (Zero Downtime)
        run: |
          echo "::error::Staging deployment is not configured. Set up authenticated hosting, a direct migration connection, and real readiness probes before enabling delivery."
          exit 1

      - name: Deploy to Cloud Run / Container Host (Staging)
        run: |
          echo "Simulating dispatch to Staging container host..."
          echo "Deployed revision: ${{ github.sha }} to environment: staging"

      - name: Health Check Verification Probe
        run: |
          echo "Verifying /health endpoint on staging..."
          # curl --fail --retry 3 https://api-staging.bodhai.internal/health

  deploy-production:
    name: Deploy to Production (Manual Approval on Tag)
    needs: [build-and-verify]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://bodhai.org
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract Release Version
        id: release_version
        run: echo "VERSION=${GITHUB_REF#refs/tags/v}" >> $GITHUB_OUTPUT

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Web Production Container
        run: |
          docker build \
            --file apps/web/Dockerfile \
            --tag bodhai-web:v${{ steps.release_version.outputs.VERSION }} \
            --build-arg NEXT_PUBLIC_APP_ENV=production \
            --build-arg NEXT_PUBLIC_API_URL=https://api.bodhai.org .

      - name: Build API Production Container
        run: |
          docker build \
            --file apps/api/Dockerfile \
            --tag bodhai-api:v${{ steps.release_version.outputs.VERSION }} .

      - name: Run Production Pre-flight Migrations (Expand Phase)
        run: |
          echo "::error::Production deployment is not configured. Migration 0012 also withdraws unreviewed questions; this is not an expand-only release. Configure and review the real deployment before enabling delivery."
          exit 1

      - name: Deploy Production Containers (Zero Downtime Rolling Update)
        run: |
          echo "Rolling deployment of BodhAI v${{ steps.release_version.outputs.VERSION }} to production..."

      - name: Synthetic Uptime Verification Probe
        run: |
          echo "Probing production health checks..."
          # curl --fail --retry 5 https://api.bodhai.org/health
          # curl --fail --retry 5 https://bodhai.org/api/health
