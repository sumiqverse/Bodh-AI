version: '3.8'

services:
  db:
    image: postgres:16-alpine
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-bodhai_dev}
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data

  api:
    build:
      context: ..
      dockerfile: infra/docker/Dockerfile.api
    restart: always
    environment:
      - APP_ENV=development
      - PORT=8000
      - DATABASE_URL=postgresql+asyncpg://postgres:postgres@db:5432/bodhai_dev
    ports:
      - '8000:8000'
    depends_on:
      - db

  web:
    build:
      context: ..
      dockerfile: infra/docker/Dockerfile.web
    restart: always
    environment:
      - NODE_ENV=production
      - NEXT_PUBLIC_API_URL=http://localhost:8000
    ports:
      - '3000:3000'
    depends_on:
      - api

volumes:
  postgres_data:
